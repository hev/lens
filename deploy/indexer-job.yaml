apiVersion: batch/v1
kind: Job
metadata:
  name: lens-indexer
  namespace: lens
  labels:
    app.kubernetes.io/name: lens
    app.kubernetes.io/component: indexer
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lens
        app.kubernetes.io/component: indexer
    spec:
      restartPolicy: Never
      nodeSelector:
        layer.hev.dev/compute: cpu
        layer.hev.dev/node-role: worker-cpu
      tolerations:
        - key: layer.hev.dev/node-role
          operator: Equal
          value: worker-cpu
          effect: NoSchedule
      containers:
        - name: indexer
          image: 186219257916.dkr.ecr.us-east-1.amazonaws.com/hev-lens-indexer@sha256:6b857b975b948741de1ef575bc45a13f514e888968359446869a48cdd457145f
          imagePullPolicy: IfNotPresent
          args:
            - --limit
            - "2500"
            - --batch-size
            - "1"
            - --write-delay-seconds
            - "1.0"
            - --reset-state
          env:
            - name: LAYER_GATEWAY_URL
              value: https://aws-us-east-1.hevlayer.com
            - name: LAYER_NAMESPACE
              value: lens-commons-quality
            - name: LAYER_TIMEOUT_SECONDS
              value: "180"
            - name: LAYER_GATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lens-turbopuffer
                  key: credential
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
